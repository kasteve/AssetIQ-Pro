<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Error - AssetIQ-Pro</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .error-card {
            max-width: 500px;
            width: 100%;
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .error-card .card-body {
            padding: 48px 32px;
            background: white;
            text-align: center;
        }
        .error-card .icon {
            font-size: 72px;
            color: #dc3545;
        }
        .btn-primary {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: none;
            padding: 12px 40px;
            border-radius: 10px;
            font-weight: 600;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(26, 26, 46, 0.3);
        }
    </style>
</head>
<body>

<div class="error-card card">
    <div class="card-body">
        <i class="fas fa-exclamation-triangle icon"></i>
        <h2 class="mt-3 text-danger fw-bold">Error</h2>
        <p class="lead" th:text="${error}">Invalid or expired signing link.</p>
        <p class="text-muted">Please contact your administrator for assistance.</p>
        <hr>
    </div>
</div>

</body>
</html>
