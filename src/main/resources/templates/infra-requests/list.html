<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head>
  <title>Infrastructure Requests - AssetIQ-Pro</title>
</head>
<body>
<div layout:fragment="content">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0"><i class="fas fa-tools me-2"></i>Infrastructure Requests</h4>
    <a href="/infra-requests/create" class="btn btn-primary">
      <i class="fas fa-plus me-2"></i>New Request
    </a>
  </div>

  <!-- Status Filter -->
  <div class="card mb-4">
    <div class="card-body">
      <div class="btn-group" role="group">
        <a href="/infra-requests?status=ALL" class="btn btn-outline-secondary">All</a>
        <a href="/infra-requests?status=PENDING" class="btn btn-outline-warning">Pending</a>
        <a href="/infra-requests?status=PROCUREMENT" class="btn btn-outline-primary">Procurement</a>
        <a href="/infra-requests?status=COMPLETED" class="btn btn-outline-success">Completed</a>
        <a href="/infra-requests?status=REJECTED" class="btn btn-outline-danger">Rejected</a>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div th:each="request : ${requests}" class="col-lg-6">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span class="fw-semibold" th:text="'#' + ${request.requestId} + ' - ' + ${request.resourceType}">#1 - Laptop</span>
          <span class="badge" th:classappend="${request.status} == 'PENDING_LM_APPROVAL' ? 'bg-warning' :
                                                          ${request.status} == 'PENDING_INFRA_REVIEW' ? 'bg-info' :
                                                          ${request.status} == 'PENDING_FINANCE_APPROVAL' ? 'bg-primary' :
                                                          ${request.status} == 'PROCUREMENT' ? 'bg-secondary' :
                                                          ${request.status} == 'DELIVERED' ? 'bg-success' :
                                                          ${request.status} == 'COMPLETED' ? 'bg-success' : 'bg-danger'"
                th:text="${request.statusDisplay}">Pending</span>
        </div>
        <div class="card-body">
          <div class="row">
            <div class="col-md-6">
              <small class="text-muted">Requested By</small>
              <div th:text="${request.requesterName}">John Doe</div>
              <small class="text-muted">Department</small>
              <div th:text="${request.requesterDepartment}">IT</div>
            </div>
            <div class="col-md-6">
              <small class="text-muted">Quantity</small>
              <div th:text="${request.quantity}">1</div>
              <small class="text-muted">Request Date</small>
              <div th:text="${#temporals.format(request.createdAt, 'dd/MM/yyyy HH:mm')}">2024-01-01</div>
            </div>
          </div>
          <div class="mt-2">
            <small class="text-muted">Justification</small>
            <p class="mb-0" th:text="${request.justification}">Reason for request</p>
          </div>
          <div class="mt-3 d-flex gap-2">
            <a th:href="@{/infra-requests/{id}(id=${request.requestId})}" class="btn btn-sm btn-primary">
              <i class="fas fa-eye me-1"></i>View
            </a>
            <a th:if="${request.status} == 'COMPLETED'"
               th:href="@{/infra-requests/{id}/pdf(id=${request.requestId})}"
               class="btn btn-sm btn-secondary">
              <i class="fas fa-file-pdf me-1"></i>PDF
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
