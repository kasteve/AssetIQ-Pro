<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head>
    <title>Create Transfer - AssetIQ-Pro</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0"><i class="fas fa-exchange-alt me-2"></i>Create Asset Transfer</h4>
        <a href="/transfers" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-2"></i>Back to Transfers
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/transfers/create}" method="post" enctype="multipart/form-data">
                <!-- Company & Asset Info -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Company *</label>
                        <select name="companyId" class="form-select" required>
                            <option value="">Select Company</option>
                            <option th:each="c : ${companies}" th:value="${c.companyId}" th:text="${c.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Transfer Date</label>
                        <input type="date" name="transferDate" class="form-control" th:value="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Category</label>
                        <select name="categoryId" class="form-select">
                            <option value="">Select Category</option>
                            <option th:each="cat : ${categories}" th:value="${cat.categoryId}" th:text="${cat.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Asset Tag</label>
                        <input type="text" name="assetTag" class="form-control" placeholder="Enter asset tag">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Serial Number</label>
                        <input type="text" name="serialNumber" class="form-control" placeholder="Enter serial number">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Version / Make</label>
                        <input type="text" name="versionMake" class="form-control" placeholder="Enter version or make">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Model / Build</label>
                        <input type="text" name="modelBuild" class="form-control" placeholder="Enter model or build">
                    </div>
                </div>

                <hr>

                <!-- Departments & Employees -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">From Department</label>
                        <select name="oldDepartmentId" class="form-select">
                            <option value="">Select Department</option>
                            <option th:each="d : ${departments}" th:value="${d.departmentId}" th:text="${d.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">To Department</label>
                        <select name="newDepartmentId" class="form-select">
                            <option value="">Select Department</option>
                            <option th:each="d : ${departments}" th:value="${d.departmentId}" th:text="${d.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">From Employee</label>
                        <select name="oldEmployeeId" class="form-select">
                            <option value="">Select Employee</option>
                            <option th:each="e : ${employees}" th:value="${e.employeeId}" th:text="${e.firstName} + ' ' + ${e.surName}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">To Employee</label>
                        <select name="newEmployeeId" class="form-select">
                            <option value="">Select Employee</option>
                            <option th:each="e : ${employees}" th:value="${e.employeeId}" th:text="${e.firstName} + ' ' + ${e.surName}"></option>
                        </select>
                    </div>
                </div>

                <hr>

                <!-- Representatives -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Infrastructure Representative</label>
                        <select name="infraRepresentativeId" class="form-select">
                            <option value="">Select Infrastructure Rep</option>
                            <option th:each="e : ${employees}" th:value="${e.employeeId}" th:text="${e.firstName} + ' ' + ${e.surName}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Finance Representative</label>
                        <select name="financeRepresentativeId" class="form-select">
                            <option value="">Select Finance Rep</option>
                            <option th:each="e : ${employees}" th:value="${e.employeeId}" th:text="${e.firstName} + ' ' + ${e.surName}"></option>
                        </select>
                    </div>
                </div>

                <hr>

                <!-- Condition & Accessories -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Previous Condition</label>
                        <textarea name="conditionOld" class="form-control" rows="2" placeholder="Describe previous condition..."></textarea>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Current Condition</label>
                        <textarea name="conditionNew" class="form-control" rows="2" placeholder="Describe current condition..."></textarea>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Previous Accessories</label>
                        <textarea name="accessoriesOld" class="form-control" rows="2" placeholder="List previous accessories..."></textarea>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Current Accessories</label>
                        <textarea name="accessoriesNew" class="form-control" rows="2" placeholder="List current accessories..."></textarea>
                    </div>
                    <div class="col-md-12 mb-3">
                        <label class="form-label fw-semibold">Software Installed</label>
                        <textarea name="softwareInstalled" class="form-control" rows="2" placeholder="List installed software..."></textarea>
                    </div>
                    <div class="col-md-12 mb-3">
                        <label class="form-label fw-semibold">Comments</label>
                        <textarea name="comments" class="form-control" rows="2" placeholder="Additional comments..."></textarea>
                    </div>
                </div>

                <hr>

                <!-- Signatures -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Old Handover By</label>
                        <select name="oldHandoverById" class="form-select">
                            <option value="">Select Employee</option>
                            <option th:each="e : ${employees}" th:value="${e.employeeId}" th:text="${e.firstName} + ' ' + ${e.surName}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Old Received By</label>
                        <select name="oldReceivedById" class="form-select">
                            <option value="">Select Employee</option>
                            <option th:each="e : ${employees}" th:value="${e.employeeId}" th:text="${e.firstName} + ' ' + ${e.surName}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">New Handover By</label>
                        <select name="newHandoverById" class="form-select">
                            <option value="">Select Employee</option>
                            <option th:each="e : ${employees}" th:value="${e.employeeId}" th:text="${e.firstName} + ' ' + ${e.surName}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">New Received By</label>
                        <select name="newReceivedById" class="form-select">
                            <option value="">Select Employee</option>
                            <option th:each="e : ${employees}" th:value="${e.employeeId}" th:text="${e.firstName} + ' ' + ${e.surName}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Configured By</label>
                        <select name="configuredById" class="form-select">
                            <option value="">Select Employee</option>
                            <option th:each="e : ${employees}" th:value="${e.employeeId}" th:text="${e.firstName} + ' ' + ${e.surName}"></option>
                        </select>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-2"></i>Create Transfer
                    </button>
                    <a href="/transfers" class="btn btn-secondary">
                        <i class="fas fa-times me-2"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
