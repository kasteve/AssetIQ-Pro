<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sign Out Complete - AssetIQ-Pro</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .thank-card {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            overflow: hidden;
            text-align: center;
            padding: 48px 32px;
        }
        .thank-card .icon {
            font-size: 72px;
            color: #198754;
        }
        .thank-card h2 {
            margin-top: 16px;
            font-weight: 700;
            color: #1a1a2e;
        }
        .thank-card p {
            color: #6c757d;
            margin-top: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: none;
            padding: 12px 40px;
            border-radius: 10px;
            font-weight: 600;
            color: white;
            text-decoration: none;
            display: inline-block;
            margin-top: 16px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(26, 26, 46, 0.3);
        }
    </style>
</head>

<body>
<div class="thank-card">
    <i class="fas fa-check-circle icon"></i>
    <h2>Sign Out Complete</h2>
    <p>You have successfully signed out of the server room.</p>
    <p class="text-muted">Thank you for using AssetIQ-Pro!</p>
    <hr>
    <p class="text-muted small">You may close this window now.</p>
    <a href="/assetIQ-pro" class="btn-primary">Go Home</a>
</div>
</body>
</html>
