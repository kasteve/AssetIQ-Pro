<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Slot Request Response - AssetIQ-Pro</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .panel-card {
            max-width: 700px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .panel-header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            padding: 20px 24px;
            border: none;
        }
        .panel-header h6 {
            font-weight: 700;
            font-size: 16px;
            margin: 0;
        }
        .panel-header h6 i {
            color: #4fc3f7;
        }
        .panel-body {
            padding: 28px 24px;
            background: white;
        }
        .detail-item {
            margin-bottom: 10px;
        }
        .detail-item .label {
            font-size: 10.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #9aa0a6;
            display: block;
        }
        .detail-item .value {
            font-size: 14.5px;
            color: #1a1a2e;
            font-weight: 500;
        }
        .booking-details {
            background: #f8f9fb;
            border-radius: 10px;
            padding: 16px;
        }
        .btn {
            border-radius: 10px !important;
            padding: 9px 20px !important;
            font-weight: 600 !important;
            font-size: 14px !important;
            border: none !important;
            min-width: 120px;
        }
        .btn-success {
            background: #198754 !important;
        }
        .btn-success:hover {
            background: #157347 !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(25, 135, 84, 0.3);
        }
        .btn-danger {
            background: #dc3545 !important;
        }
        .btn-danger:hover {
            background: #b02a37 !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3);
        }
        .btn-secondary {
            background: #eef0f3 !important;
            color: #1a1a2e !important;
        }
        .btn-secondary:hover {
            background: #e2e5ea !important;
            color: #1a1a2e !important;
        }
        .btn-lg {
            padding: 12px 32px !important;
            font-size: 16px !important;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
        }
        .status-badge.booked {
            background: #e6f7ec;
            color: #198754;
        }
        .alert {
            border-radius: 12px;
            border: none;
            padding: 16px 20px;
            font-weight: 500;
        }
        .alert-info {
            background: #e8f4fd;
            color: #0dcaf0;
        }
        .text-center {
            text-align: center;
        }
        .mt-3 { margin-top: 16px; }
        .mb-4 { margin-bottom: 24px; }
        .gap-3 { gap: 16px; }
        .d-flex { display: flex; }
        .justify-content-center { justify-content: center; }
    </style>
</head>

<body>
<div class="panel-card">
    <div class="panel-header">
        <h6><i class="fas fa-handshake me-2"></i>Slot Request</h6>
    </div>
    <div class="panel-body">
        <div class="alert alert-info">
            <i class="fas fa-info-circle me-2"></i>
            <strong th:text="${requesterName}">System Administrator</strong> has requested to use your booked slot.
        </div>

        <div class="booking-details mb-4">
            <h6 class="fw-bold">Booking Details</h6>
            <div class="row">
                <div class="col-md-6">
                    <div class="detail-item">
                        <span class="label">Room</span>
                        <span class="value" th:text="${roomName}">Test Room1</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Booked By</span>
                        <span class="value" th:text="${bookedBy}">Normal Employee</span>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="detail-item">
                        <span class="label">Time Slot</span>
                        <span class="value" th:text="${timeSlot}">19/07/2026 18:16 - 23:16</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Status</span>
                        <span class="status-badge booked">BOOKED</span>
                    </div>
                </div>
            </div>
            <div th:if="${purpose != null}" class="detail-item">
                <span class="label">Purpose</span>
                <span class="value" th:text="${purpose}">Meeting</span>
            </div>
        </div>

        <div class="text-center">
            <p class="text-muted">Do you approve this slot request?</p>
            <div class="d-flex justify-content-center gap-3">
                <form th:action="'/assetIQ-pro/bookings/slot-request/' + ${bookingId} + '/approve'" method="post" style="display:inline;">
                    <input type="hidden" name="requesterId" th:value="${requesterId}">
                    <button type="submit" class="btn btn-success btn-lg">
                        <i class="fas fa-check me-2"></i>Approve
                    </button>
                </form>
                <form th:action="'/assetIQ-pro/bookings/slot-request/' + ${bookingId} + '/decline'" method="post" style="display:inline;">
                    <input type="hidden" name="requesterId" th:value="${requesterId}">
                    <button type="submit" class="btn btn-danger btn-lg">
                        <i class="fas fa-times me-2"></i>Decline
                    </button>
                </form>
            </div>
            <a href="/assetIQ-pro/bookings/bookings-dashboard" class="btn btn-secondary mt-3">Go to Dashboard</a>
        </div>
    </div>
</div>
</body>
</html>
