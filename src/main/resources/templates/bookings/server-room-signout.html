<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Server Room Sign Out - AssetIQ-Pro</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .panel-card {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .panel-header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            padding: 20px 24px;
            border: none;
        }
        .panel-header h6 {
            font-weight: 700;
            font-size: 16px;
            margin: 0;
        }
        .panel-header h6 i {
            color: #4fc3f7;
        }
        .panel-body {
            padding: 28px 24px;
            background: white;
        }
        .detail-item {
            margin-bottom: 10px;
        }
        .detail-item .label {
            font-size: 10.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #9aa0a6;
            display: block;
        }
        .detail-item .value {
            font-size: 14.5px;
            color: #1a1a2e;
            font-weight: 500;
        }
        .booking-details {
            background: #f8f9fb;
            border-radius: 10px;
            padding: 16px;
        }
        .btn {
            border-radius: 10px !important;
            padding: 9px 20px !important;
            font-weight: 600 !important;
            font-size: 14px !important;
            border: none !important;
            min-width: 120px;
        }
        .btn-success {
            background: #198754 !important;
        }
        .btn-success:hover {
            background: #157347 !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(25, 135, 84, 0.3);
        }
        .btn-secondary {
            background: #eef0f3 !important;
            color: #1a1a2e !important;
        }
        .btn-secondary:hover {
            background: #e2e5ea !important;
            color: #1a1a2e !important;
        }
        .btn-lg {
            padding: 12px 32px !important;
            font-size: 16px !important;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
        }
        .status-badge.active {
            background: #e8f4fd;
            color: #0dcaf0;
        }
        .alert {
            border-radius: 12px;
            border: none;
            padding: 16px 20px;
            font-weight: 500;
        }
        .alert-info {
            background: #e8f4fd;
            color: #0dcaf0;
        }
        .text-center {
            text-align: center;
        }
        .mt-3 { margin-top: 16px; }
        .mb-4 { margin-bottom: 24px; }
        .form-label {
            font-weight: 600;
            font-size: 13px;
            color: #1a1a2e;
            margin-bottom: 5px;
        }
        .form-control {
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            padding: 10px 14px;
            font-size: 14px;
            width: 100%;
        }
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.08);
        }
        .signature-pad {
            border: 2px solid #dee2e6;
            border-radius: 10px;
            padding: 8px;
            background: white;
        }
        .signature-pad canvas {
            width: 100%;
            height: 150px;
            border-radius: 6px;
            cursor: crosshair;
            background: white;
            touch-action: none;
        }
        .mt-2 { margin-top: 8px; }
        .mb-2 { margin-bottom: 8px; }
    </style>
</head>

<body>
<div class="panel-card">
    <div class="panel-header">
        <h6><i class="fas fa-sign-out-alt me-2"></i>Server Room Sign Out</h6>
    </div>
    <div class="panel-body">
        <div class="alert alert-info">
            <i class="fas fa-info-circle me-2"></i>
            Please sign out of the server room after completing your session.
        </div>

        <div class="booking-details mb-4">
            <h6 class="fw-bold">Session Details</h6>
            <div class="row">
                <div class="col-md-6">
                    <div class="detail-item">
                        <span class="label">Room</span>
                        <span class="value" th:text="${roomName}">Server Room</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Booking ID</span>
                        <span class="value" th:text="${bookingId}">#1</span>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="detail-item">
                        <span class="label">Status</span>
                        <span class="status-badge active">ACTIVE</span>
                    </div>
                </div>
            </div>
        </div>

        <form th:action="@{/assetIQ-pro/bookings/server-room/sign-out}" method="post" id="signOutForm">
            <input type="hidden" name="token" th:value="${token}">
            <input type="hidden" name="signature" id="signatureData">

            <div class="mb-3">
                <label class="form-label">Session Comments</label>
                <textarea name="requesterComment" class="form-control" rows="3" placeholder="Any issues or notes about your server room session?"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Signature *</label>
                <p class="text-muted small">Draw your signature below</p>
                <div class="signature-pad">
                    <canvas id="signatureCanvas" width="500" height="150"></canvas>
                    <div class="mt-2">
                        <button type="button" class="btn btn-sm btn-secondary" onclick="clearSignature()">
                            <i class="fas fa-eraser me-1"></i>Clear
                        </button>
                    </div>
                </div>
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-success btn-lg" onclick="return prepareSubmit()">
                    <i class="fas fa-sign-out-alt me-2"></i>Sign Out
                </button>
                <a href="/assetIQ-pro" class="btn btn-secondary mt-3 d-block">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
    let canvas = null;
    let ctx = null;
    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;

    function initSignaturePad() {
        canvas = document.getElementById('signatureCanvas');
        if (!canvas) return;
        ctx = canvas.getContext('2d');
        resizeCanvas();

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);
        window.addEventListener('resize', resizeCanvas);
    }

    function resizeCanvas() {
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = 150;
        if (ctx) {
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#1a1a2e';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }
    }

    function getPosition(e) {
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches ? e.touches[0] : e;
        return {
            x: (touch.clientX - rect.left) * (canvas.width / rect.width),
            y: (touch.clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    function startDrawing(e) {
        e.preventDefault();
        isDrawing = true;
        const pos = getPosition(e);
        lastX = pos.x;
        lastY = pos.y;
    }

    function draw(e) {
        e.preventDefault();
        if (!isDrawing) return;
        const pos = getPosition(e);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        lastX = pos.x;
        lastY = pos.y;
    }

    function stopDrawing(e) {
        e.preventDefault();
        isDrawing = false;
    }

    function clearSignature() {
        if (ctx) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
        document.getElementById('signatureData').value = '';
    }

    function prepareSubmit() {
        if (!canvas) return false;

        const dataUrl = canvas.toDataURL('image/png');
        const emptySignature = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';
        if (dataUrl === emptySignature) {
            alert('⚠️ Please draw your signature first.');
            return false;
        }

        document.getElementById('signatureData').value = dataUrl;
        return true;
    }

    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(initSignaturePad, 200);
    });
</script>
</body>
</html>
