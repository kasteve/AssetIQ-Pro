<!-- templates/bookings/list.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head>
    <title>Bookings - AssetIQ-Pro</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0"><i class="fas fa-calendar-check me-2"></i>Bookings</h4>
        <div>
            <a href="/bookings/room/create" class="btn btn-primary">
                <i class="fas fa-plus me-2"></i>Book Room
            </a>
            <a href="/bookings/driver/request" class="btn btn-outline-primary">
                <i class="fas fa-car me-2"></i>Request Driver
            </a>
        </div>
    </div>

    <!-- Today's Bookings -->
    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header">
                    <h6 class="mb-0"><i class="fas fa-calendar-day me-2"></i>Today's Bookings</h6>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>Room</th>
                                <th>Booked By</th>
                                <th>Time</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="booking : ${todayBookings}">
                                <td th:text="${booking.roomName}">Boardroom</td>
                                <td th:text="${booking.userName}">John Doe</td>
                                <td>
                                    <span th:text="${#temporals.format(booking.startTime, 'HH:mm')}">10:00</span>
                                    -
                                    <span th:text="${#temporals.format(booking.endTime, 'HH:mm')}">11:00</span>
                                </td>
                                <td>
                                        <span class="badge" th:classappend="${booking.status} == 'BOOKED' ? 'bg-success' : 'bg-warning'"
                                              th:text="${booking.status}">Booked</span>
                                </td>
                                <td>
                                    <button class="btn btn-sm btn-outline-danger" onclick="cancelBooking(${booking.bookingId})">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Available Rooms -->
        <div class="col-lg-4">
            <div class="card">
                <div class="card-header">
                    <h6 class="mb-0"><i class="fas fa-door-open me-2"></i>Available Rooms</h6>
                </div>
                <div class="card-body p-0">
                    <div class="list-group list-group-flush">
                        <div th:each="room : ${availableRooms}" class="list-group-item d-flex justify-content-between align-items-center">
                            <span th:text="${room.roomName}">Boardroom</span>
                            <span class="badge bg-success">Available</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function cancelBooking(id) {
        if (confirm('Cancel this booking?')) {
            window.location.href = '/bookings/' + id + '/cancel';
        }
    }
</script>
</body>
</html>
