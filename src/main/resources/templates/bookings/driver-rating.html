<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Your Driver - AssetIQ-Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0d6efd);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .rating-container {
            background: white;
            border-radius: 20px;
            padding: 45px 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .rating-container .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .rating-container .logo h2 {
            font-weight: 700;
            color: #1a1a2e;
        }

        .rating-container .logo span {
            color: #0d6efd;
        }

        .rating-container .logo p {
            color: #6c757d;
            font-size: 14px;
        }

        .driver-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            margin: 0 auto 16px;
        }

        .rating-stars {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 20px 0;
        }

        .rating-stars i {
            font-size: 44px;
            color: #e4e5e9;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .rating-stars i.active {
            color: #ffc107;
        }

        .rating-stars i:hover {
            color: #ffc107;
            transform: scale(1.15);
        }

        .btn-primary {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            background: #0d6efd;
            border: none;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-primary:hover {
            background: #0b5ed7;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
        }

        .btn-secondary {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            background: #e9ecef;
            border: none;
            color: #333;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-secondary:hover {
            background: #dee2e6;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.1);
        }

        .alert {
            border-radius: 10px;
        }

        .success-icon {
            font-size: 64px;
            color: #198754;
        }
        .error-icon {
            font-size: 64px;
            color: #dc3545;
        }

        @media (max-width: 576px) {
            .rating-container {
                padding: 30px 20px;
            }
            .rating-stars i {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
<div class="rating-container">
    <div class="logo">
        <h2><i class="fas fa-cubes"></i> Asset<span>IQ-Pro</span></h2>
        <p>Rate Your Driver</p>
    </div>

    <!-- Error Message -->
    <div th:if="${error != null}" class="alert alert-danger text-center">
        <i class="fas fa-exclamation-circle me-2"></i>
        <span th:text="${error}">Error</span>
    </div>

    <!-- Already Rated -->
    <div th:if="${alreadyRated != null and alreadyRated}">
        <div class="text-center">
            <div class="success-icon mb-3">
                <i class="fas fa-check-circle"></i>
            </div>
            <h4 class="fw-bold text-success">Already Rated!</h4>
            <p class="text-muted" th:text="${message}">You have already rated this driver.</p>
            <a href="/assetIQ-pro" class="btn btn-primary mt-3">Back to Home</a>
        </div>
    </div>

    <!-- Rating Form -->
    <div th:unless="${(alreadyRated != null and alreadyRated) or (error != null)}">
        <div class="text-center mb-4">
            <div class="driver-avatar">
                <span th:text="${#strings.substring(driverName, 0, 1)}">D</span>
            </div>
            <h5 class="fw-bold" th:text="${driverName}">Driver Name</h5>
            <p class="text-muted mb-1">
                <i class="fas fa-map-marker-alt me-1"></i>
                <span th:text="${destination}">Destination</span>
            </p>
            <p class="text-muted small">
                <i class="far fa-calendar-alt me-1"></i>
                <span th:text="${#temporals.format(requestTime, 'dd/MM/yyyy HH:mm')}">Time</span>
            </p>
        </div>

        <form th:action="@{'/bookings/driver-rating/' + ${requestId}}" method="post">
            <input type="hidden" name="token" th:value="${token}">
            <input type="hidden" name="userId" th:value="${userId}">

            <div class="text-center mb-3">
                <label class="form-label fw-bold">How would you rate this driver?</label>
            </div>

            <div class="rating-stars">
                <i class="fas fa-star" data-rating="1" onclick="setRating(1)"></i>
                <i class="fas fa-star" data-rating="2" onclick="setRating(2)"></i>
                <i class="fas fa-star" data-rating="3" onclick="setRating(3)"></i>
                <i class="fas fa-star" data-rating="4" onclick="setRating(4)"></i>
                <i class="fas fa-star" data-rating="5" onclick="setRating(5)"></i>
                <input type="hidden" name="rating" id="ratingInput" value="5" required>
            </div>

            <div class="mb-3">
                <label for="feedbackInput" class="form-label fw-semibold">Feedback <span class="text-muted">(Optional)</span></label>
                <textarea id="feedbackInput" name="feedback" class="form-control" rows="3"
                          placeholder="Share your experience with this driver..."></textarea>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane me-2"></i>Submit Rating
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentRating = 5;

    function setRating(rating) {
        currentRating = rating;
        document.getElementById('ratingInput').value = rating;

        const stars = document.querySelectorAll('.rating-stars i');
        stars.forEach(function(star, index) {
            if (index < rating) {
                star.classList.add('active');
            } else {
                star.classList.remove('active');
            }
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        setRating(5);
    });
</script>
</body>
</html>
