<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - AssetIQ-Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0d6efd);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .status-container {
            background: white;
            border-radius: 20px;
            padding: 45px 40px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeInUp 0.6s ease;
            text-align: center;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-container .logo {
            margin-bottom: 24px;
        }

        .status-container .logo h2 {
            font-weight: 700;
            color: #1a1a2e;
        }

        .status-container .logo span {
            color: #0d6efd;
        }

        .success-icon {
            font-size: 64px;
            color: #198754;
            margin-bottom: 16px;
        }

        .status-container h5 {
            font-weight: 700;
            color: #198754;
            margin-bottom: 10px;
        }

        .status-container p {
            color: #6c757d;
        }

        .btn-primary {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            background: #0d6efd;
            border: none;
            color: #fff;
            transition: all 0.3s ease;
            width: 100%;
            display: inline-block;
            text-decoration: none;
            margin-top: 24px;
        }

        .btn-primary:hover {
            background: #0b5ed7;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
        }

        @media (max-width: 576px) {
            .status-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
<div class="status-container">
    <div class="logo">
        <h2><i class="fas fa-cubes"></i> Asset<span>IQ-Pro</span></h2>
    </div>

    <div class="success-icon">
        <i class="fas fa-check-circle"></i>
    </div>
    <h5>Thank You!</h5>
    <p>Your rating has been submitted successfully.</p>

    <a href="/assetIQ-pro" class="btn-primary">
        <i class="fas fa-arrow-left me-2"></i>Back to Home
    </a>
</div>
</body>
</html>
