<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/base}">
<head>
    <title>User Management - AssetIQ-Pro</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0"><i class="fas fa-users-cog me-2"></i>User Management</h4>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createUserModal">
            <i class="fas fa-user-plus me-2"></i>Add User
        </button>
    </div>

    <!-- User Stats -->
    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <div class="stat-card" style="border-left-color: #0d6efd;">
                <div class="stat-number" th:text="${stats.totalUsers}">0</div>
                <div class="stat-label">Total Users</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card" style="border-left-color: #28a745;">
                <div class="stat-number" th:text="${stats.activeUsers}">0</div>
                <div class="stat-label">Active</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card" style="border-left-color: #ffc107;">
                <div class="stat-number" th:text="${stats.pendingPasswordChange}">0</div>
                <div class="stat-label">Pending Password Change</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card" style="border-left-color: #dc3545;">
                <div class="stat-number" th:text="${stats.blockedUsers}">0</div>
                <div class="stat-label">Blocked</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Username</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Status</th>
                        <th>Permissions</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td>
                            <span class="fw-semibold" th:text="${user.username}">johndoe</span>
                        </td>
                        <td th:text="${user.fullName}">John Doe</td>
                        <td th:text="${user.email}">john@company.com</td>
                        <td th:text="${user.department}">IT</td>
                        <td>
                                <span class="badge" th:classappend="${user.active} ? 'bg-success' : 'bg-danger'"
                                      th:text="${user.active} ? 'Active' : 'Inactive'">Active</span>
                            <span th:if="${user.blocked}" class="badge bg-dark ms-1">Blocked</span>
                            <span th:if="${user.mustChangePassword}" class="badge bg-warning ms-1">Change Password</span>
                        </td>
                        <td>
                            <span th:each="perm : ${user.permissions}" class="badge bg-info me-1" th:text="${perm}">VIEW</span>
                        </td>
                        <td>
                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-outline-primary" onclick="editUser(${user.userId})">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-outline-warning" onclick="resetPassword(${user.userId})">
                                    <i class="fas fa-key"></i>
                                </button>
                                <button th:if="${user.active}" class="btn btn-outline-danger" onclick="toggleUser(${user.userId})">
                                    <i class="fas fa-ban"></i>
                                </button>
                                <button th:unless="${user.active}" class="btn btn-outline-success" onclick="toggleUser(${user.userId})">
                                    <i class="fas fa-check"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Create User Modal -->
<div class="modal fade" id="createUserModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create New User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/admin/users}" method="post">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Username *</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Full Name *</label>
                        <input type="text" name="fullName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email *</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Department</label>
                        <input type="text" name="department" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Permissions</label>
                        <select name="permissions" class="form-select" multiple size="6">
                            <option th:each="perm : ${allPermissions}" th:value="${perm.permissionName}" th:text="${perm.permissionName} + ' - ' + ${perm.description}">Permission</option>
                        </select>
                        <small class="text-muted">Hold Ctrl/Cmd to select multiple</small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create User</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function editUser(id) {
        window.location.href = '/admin/users/' + id + '/edit';
    }

    function resetPassword(id) {
        if (confirm('Send password reset email to this user?')) {
            window.location.href = '/admin/users/' + id + '/reset-password';
        }
    }

    function toggleUser(id) {
        if (confirm('Toggle user status?')) {
            window.location.href = '/admin/users/' + id + '/toggle';
        }
    }
</script>
</body>
</html>
