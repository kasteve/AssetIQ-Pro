<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head>
    <title>Change Password - AssetIQ-Pro</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0"><i class="fas fa-key me-2"></i>Change Password</h5>
                </div>
                <div class="card-body">
                    <div th:if="${param.firstLogin}" class="alert alert-warning">
                        <i class="fas fa-info-circle me-2"></i> Please change your password on first login.
                    </div>

                    <div th:if="${success}" class="alert alert-success">
                        <i class="fas fa-check-circle me-2"></i> <span th:text="${success}">Password changed successfully!</span>
                    </div>

                    <div th:if="${error}" class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i> <span th:text="${error}">Error message</span>
                    </div>

                    <form th:action="@{/change-password}" method="post">
                        <input type="hidden" name="userId" th:value="${userId}">
                        <input type="hidden" name="firstLogin" th:value="${param.firstLogin}">

                        <div class="mb-3" th:if="${not param.firstLogin}">
                            <label class="form-label fw-semibold">Current Password</label>
                            <input type="password" name="currentPassword" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">New Password</label>
                            <input type="password" name="newPassword" class="form-control" required>
                            <small class="text-muted">Password must be at least 8 characters with uppercase, lowercase and number.</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Confirm Password</label>
                            <input type="password" name="confirmPassword" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i> Change Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
