<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - AssetIQ-Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        body{
            background:linear-gradient(135deg,#1a1a2e,#16213e,#0d6efd);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
        }

        .login-container{
            background:#fff;
            width:100%;
            max-width:460px;
            padding:45px 40px;
            border-radius:20px;
            box-shadow:0 20px 60px rgba(0,0,0,.3);
            animation:fadeInUp .6s ease;
        }

        @keyframes fadeInUp{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .logo{
            text-align:center;
            margin-bottom:30px;
        }

        .logo h2{
            font-weight:700;
            color:#1a1a2e;
        }

        .logo span{
            color:#0d6efd;
        }

        .logo p{
            color:#6c757d;
            font-size:14px;
        }

        .form-control{
            border-radius:10px;
            padding:12px 15px;
            border:2px solid #e9ecef;
        }

        .form-control:focus{
            border-color:#0d6efd;
            box-shadow:0 0 0 4px rgba(13,110,253,.10);
        }

        .input-group-text{
            background:#fff;
            border:2px solid #e9ecef;
            border-right:none;
        }

        .input-group .form-control{
            border-left:none;
        }

        .btn-primary{
            border-radius:10px;
            padding:12px;
            font-weight:600;
            border:none;
            transition:.3s;
        }

        .btn-primary:hover{
            transform:translateY(-2px);
            box-shadow:0 4px 12px rgba(13,110,253,.3);
        }

        .alert{
            border-radius:10px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        <h2><i class="fas fa-cubes"></i> Asset<span>IQ-Pro</span></h2>
        <p>Secure Password Management</p>
    </div>

    <div th:if="${param.firstLogin}" class="alert alert-warning">
        <i class="fas fa-info-circle me-2"></i>
        Please change your password before continuing.
    </div>

    <div th:if="${success}" class="alert alert-success">
        <i class="fas fa-check-circle me-2"></i>
        <span th:text="${success}"></span>
    </div>

    <div th:if="${error}" class="alert alert-danger">
        <i class="fas fa-exclamation-circle me-2"></i>
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/change-password}" method="post">

        <input type="hidden" name="userId" th:value="${userId}">
        <input type="hidden" name="firstLogin" th:value="${param.firstLogin}">

        <div class="mb-3" th:if="${not param.firstLogin}">
            <label class="form-label fw-semibold">Current Password</label>
            <div class="input-group">
                <span class="input-group-text">
                    <i class="fas fa-lock"></i>
                </span>
                <input type="password"
                       name="currentPassword"
                       class="form-control"
                       placeholder="Current Password"
                       required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">New Password</label>
            <div class="input-group">
                <span class="input-group-text">
                    <i class="fas fa-key"></i>
                </span>
                <input type="password"
                       name="newPassword"
                       class="form-control"
                       placeholder="New Password"
                       required>
            </div>

            <small class="text-muted">
                Password must be at least 8 characters and contain uppercase, lowercase and a number.
            </small>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold">Confirm Password</label>
            <div class="input-group">
                <span class="input-group-text">
                    <i class="fas fa-check"></i>
                </span>
                <input type="password"
                       name="confirmPassword"
                       class="form-control"
                       placeholder="Confirm Password"
                       required>
            </div>
        </div>

        <button class="btn btn-primary w-100" type="submit">
            <i class="fas fa-save me-2"></i>
            Change Password
        </button>

    </form>

    <div class="text-center mt-4">
        <small class="text-muted">
            &copy; 2026 AssetIQ-Pro. All rights reserved.
        </small>
    </div>

</div>

</body>
</html>
