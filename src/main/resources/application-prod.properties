# ============================================
# Production Overrides
# ============================================

# Override Base URL for production
app.base-url=https://sandbox.interswitch.io
app.context-path=/assetIQ-pro

# Server - Production port
server.port=8091

# Database - Production
spring.datasource.url=jdbc:sqlserver://your-prod-db-server:1433;databaseName=AssetIQ_Pro_db;encrypt=true;trustServerCertificate=false
spring.datasource.username=your_prod_username
spring.datasource.password=your_prod_password

# File Upload - Production path
upload.directory=C:/assetiq-pro/uploads/

# Logging - Less verbose in production
logging.level.com.stevecodes.AssetIQPro=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO

# Session - Secure in production
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=Strict

# Thymeleaf - Cache in production
spring.thymeleaf.cache=true

# JWT - Production secret (use environment variable)
